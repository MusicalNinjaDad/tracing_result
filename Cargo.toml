[package]
name = "tracing-result"
description = "An ergonomic wrapper making it easy to emit tracing messages on errors."
categories = ["rust-patterns"]
keywords = ["tracing"]
authors = ["Mike Foster <https://github.com/MusicalNinjaDad>"]
repository = "https://github.com/MusicalNinjaDad/tracing_result"
license = "MIT"
edition = "2024"
version = "0.0.2"
exclude = [
    "/.vibe/plans",
    "/.vibe/.tmp",
    "/docs/**/*.json",
    "/graphify-out/cache",
]

[dependencies]
try_v2 = { version = "0.11.0", default-features = false, features = ["traits"] }
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-test = "0.2.6"

[build-dependencies]
build_safely = "0.5.4"

[workspace.metadata.ninja-xtask]
env = { "LD_LIBRARY_PATH" = false }
